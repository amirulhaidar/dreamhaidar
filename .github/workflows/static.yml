name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check site and video files
        shell: bash
        run: |
          node scripts/check-site.mjs
          for file in js/*.js scripts/*.mjs; do node --check "$file"; done
          test -s assets/haidar-hero.mp4
          test -s assets/haidar-hero-poster.jpg
          test -s assets/haidar-profile-new.jpg
          test -s assets/clients/indonesia/21-mumtaz-sabila.png
          test "$(stat -c%s assets/haidar-hero.mp4)" -lt 100000000
      - name: Prepare clean static site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html layanan.html _site/
          cp -R assets css js fonts _site/
          cp LICENSE-*.txt _site/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: _site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
